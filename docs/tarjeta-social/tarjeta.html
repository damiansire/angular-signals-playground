<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Tarjeta social</title>
<!--
  Tarjeta para compartir (og:image / twitter:image), 1200×630. La escena en una frase: Angie
  levanta su lamparita, que es la señal; la luz corre por los cables y se enciende cada nodo que la
  lee, y el que no tiene cable sigue durmiendo. Angie es la pose de frente de mascota-viva, copiada
  tal cual (sonriendo). Para regenerar public/tarjeta-social.jpg, con Edge o Chrome:

    msedge --headless=new --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630
      --virtual-time-budget=8000 --screenshot=tarjeta.png docs/tarjeta-social/tarjeta.html

  y pasar el PNG a JPEG (calidad 90). Si cambia la mascota, volver a copiar su pose de frente.
-->

  .tarjeta { position: relative; width: 1200px; height: 630px; overflow: hidden; user-select: none; }
  .tarjeta svg { position: absolute; inset: 0; display: block; }
  .texto { position: absolute; left: 68px; top: 92px; width: 470px; color: #fff8ec; }
  .copete {
    font: 700 19px/1 'Archivo', sans-serif; letter-spacing: .2em; text-transform: uppercase;
    color: #c9b6ff; margin: 0 0 18px;
  }
  h1 {
    margin: 0; font: 800 118px/.86 'Baloo 2', sans-serif; letter-spacing: -.01em;
    text-shadow: 0 6px 0 rgba(25, 8, 40, .75), 0 14px 34px rgba(25, 8, 40, .55);
  }
  h1 .clave { color: #ffd56a; display: block; }
  .bajada {
    margin: 26px 0 0; font: 700 31px/1.18 'Archivo', sans-serif; color: #f1e6ff;
    text-shadow: 0 3px 0 rgba(25, 8, 40, .7), 0 8px 22px rgba(25, 8, 40, .5);
  }
  .bajada b { color: #ffd56a; }
  .url {
    position: absolute; left: 68px; bottom: 34px; font: 600 18px/1 'JetBrains Mono', monospace;
    color: #9d8ccf;
  }
</style>

<script>
  // Estrellas con semilla: la tarjeta sale igual cada vez que se regenera.
  let s = 7;
  const azar = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  const ns = 'http://www.w3.org/2000/svg';
  const capa = document.getElementById('estrellas');
  for (let i = 0; i < 110; i++) {
    const x = azar() * 1200, y = azar() * 430;
    // Cerca de la lamparita el halo las tapa: ahí no van.
    if (Math.hypot(x - 570, y - 276) < 150) continue;
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('cx', x.toFixed(1));
    c.setAttribute('cy', y.toFixed(1));
    c.setAttribute('r', (0.6 + azar() * 1.6).toFixed(2));
    c.setAttribute('fill', azar() < 0.2 ? '#ffd56a' : '#e8dcff');
    c.setAttribute('opacity', (0.25 + azar() * 0.6).toFixed(2));
    capa.appendChild(c);
  }
  document.fonts.ready.then(() => document.body.setAttribute('data-listo', ''));
</script>
