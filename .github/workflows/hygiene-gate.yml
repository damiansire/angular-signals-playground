name: Hygiene Gate

# Gate preventivo global (roastme 2026-07-17, items 1.3d + 3.3e): falla si queda
# trackeado un .env, o un descartable de sesion tipo claude-scratch-*/temp_*/
# rewrite<N>.py. Higiene dependiente del gate, no del habito (Netflix/Instagram).
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: hygiene-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sin .env* / reportes internos / descartables de sesion trackeados
        shell: bash
        run: |
          set -e
          # (^|/)\.env($|\.) cubre .env, .env.local y .env.production: anclar en \.env$ dejaba
          # pasar justo los que genera el tooling por defecto. .env.example queda permitido.
          # Los reportes de auditoria (_audit/, _audits/, AUDITORIA.md) dependian solo de
          # .git/info/exclude, que no se clona ni lo ve CI.
          MATCHES=$(git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)_audits?/|(^|/)AUDITORIA\.md$|(^|/)claude-scratch-[^/]*$|(^|/)temp_[^/]*$|(^|/)rewrite[0-9]+\.py$' | grep -Ev '(^|/)\.env\.example$' || true)
          if [ -n "$MATCHES" ]; then
            echo "Archivos trackeados que no deberian estar en el repo:"
            echo "$MATCHES"
            exit 1
          fi
          echo "OK: ningun patron prohibido trackeado."
