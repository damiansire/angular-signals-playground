name: Deploy to GitHub Pages

# Se dispara al TERMINAR el workflow CI, no al pushear. Antes ambos arrancaban en paralelo con
# `on: push`, asi que Pages publicaba aunque lint o los tests fallaran: el unico gate efectivo del
# camino a produccion era "compila". Ahora el deploy solo existe si CI cerro en verde.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

# Permisos mínimos para publicar en Pages con el source "GitHub Actions".
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy a la vez; no cancela el que esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Las cuatro condiciones del workflow_run son TODAS necesarias, y la de head_repository es la
    # que cierra el agujero real: `ci.yml` corre tambien on:pull_request, asi que un PR desde un
    # fork con una rama llamada como la default disparaba este deploy, que hacia checkout del
    # commit del fork y corria `npm ci` (o sea, los lifecycle scripts de un desconocido) dentro de
    # un job con pages:write + id-token:write. Y lo publicado comparte origen con las demas project
    # pages del usuario, asi que ese JS leia el localStorage y las cookies de los otros proyectos.
    # Es el patron pwn-request de manual. Exigir que el head sea de ESTE repo lo corta.
    #
    # `workflow_run.event == 'push'` descarta de entrada los runs de PR; el resto es cinturon y
    # tiradores. La rama sale de `repository.default_branch` y no de la constante 'master', para
    # que renombrar la rama no reabra el agujero en silencio.
    #
    # El disparo manual queda acotado a la rama default de este repo (solo alguien con permiso de
    # escritura puede lanzarlo). Republica sin pasar por CI a proposito: es la valvula para
    # re-desplegar un commit que YA paso CI, no una via para publicar algo sin verificar.
    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          # Publicar EXACTAMENTE el commit que CI aprobo, no la punta de master, que para cuando
          # termina CI puede tener commits nuevos todavia sin verificar.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # base-href apunta al sub-path del project page: sin esto los assets y el
      # router se referencian desde la raíz del dominio y dan 404 bajo /<repo>/.
      - run: npm run build -- --configuration production --base-href /angular-signals-playground/
      # Fallback SPA: Pages sirve 404.html ante una ruta desconocida (deep-link o
      # reload). Copiar el index deja que el router de Angular resuelva la ruta.
      - run: cp dist/angular-examples/browser/index.html dist/angular-examples/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/angular-examples/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
