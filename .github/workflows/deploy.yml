name: Deploy to GitHub Pages

# Se dispara al TERMINAR el workflow CI, no al pushear. Antes ambos arrancaban en paralelo con
# `on: push`, asi que Pages publicaba aunque lint o los tests fallaran: el unico gate efectivo del
# camino a produccion era "compila". Ahora el deploy solo existe si CI cerro en verde.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

# Permisos mínimos para publicar en Pages con el source "GitHub Actions".
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy a la vez; no cancela el que esté en curso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # workflow_run tambien llega cuando CI corrio sobre la rama de un PR o cuando fallo/se cancelo.
    # Solo publica master en verde; el disparo manual queda habilitado para republicar a mano.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    steps:
      - uses: actions/checkout@v4
        with:
          # Publicar EXACTAMENTE el commit que CI aprobo, no la punta de master, que para cuando
          # termina CI puede tener commits nuevos todavia sin verificar.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # base-href apunta al sub-path del project page: sin esto los assets y el
      # router se referencian desde la raíz del dominio y dan 404 bajo /<repo>/.
      - run: npm run build -- --configuration production --base-href /angular-signals-playground/
      # Fallback SPA: Pages sirve 404.html ante una ruta desconocida (deep-link o
      # reload). Copiar el index deja que el router de Angular resuelva la ruta.
      - run: cp dist/angular-examples/browser/index.html dist/angular-examples/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/angular-examples/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
