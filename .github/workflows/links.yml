name: Links

on:
  push:
    branches: [master]
    paths:
      - '**/*.md'
      - '.github/workflows/links.yml'
      - '.lycheeignore'
  pull_request:
    branches: [master]
    paths:
      - '**/*.md'
      - '.github/workflows/links.yml'
      - '.lycheeignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  link-check:
    name: Check README links and badges
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinneada al SHA completo, no al tag: es la unica action de tercero del repo y recibe el
      # GITHUB_TOKEN. Un tag es mutable, asi que "v2" puede pasar a apuntar a otro codigo sin que
      # cambie nada aca. Las actions/* se dejan por tag: las publica GitHub, el mismo que corre el runner.
      - name: Link Checker
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # Fail the build if any README/Markdown link or badge is broken.
          fail: true
          args: >-
            --no-progress
            --verbose
            './**/*.md'
        env:
          # Higher GitHub API rate limit for github.com links.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
