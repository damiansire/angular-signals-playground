<h2 class="historial__titulo">{{ title() }}</h2>

<div class="historial">
  <!-- Sin esto el panel abre como un rectángulo vacío y se lee como espacio muerto o como algo
       roto. El default es lo más usado que se shippea: casi nadie toca nada antes de juzgar.
       Va por el número de corrida y no por la posición: la nueva es otro elemento y entra con su salto. -->
  @for (fila of recientes(); track fila.corrida) {
    @let item = fila.item;
    <div class="historial__fila">
      <span class="historial__rotulo">{{ stateName() }}</span>
      <span class="historial__valor">
        @if (item.isCountIncrement) {
          {{ item.newState && beforeNumber(item.newState) }}
          <span class="historial__flecha">-></span>
        }
        {{ item.newState }}
      </span>
      <h3 class="historial__rotulo">Disparo:</h3>
      <span class="historial__chip">{{ item.trigger }}</span>
    </div>
  } @empty {
    <p class="historial__vacio">Todavía no corrió nada.</p>
  }
</div>
