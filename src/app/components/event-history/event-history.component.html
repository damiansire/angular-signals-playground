<h2 class="text-2xl font-semibold mb-4 text-center">{{ title() }}</h2>

<div class="space-y-4">
  <!-- Sin esto el panel abre como un rectángulo vacío y se lee como espacio muerto o como algo
       roto. El default es lo más usado que se shippea: casi nadie toca nada antes de juzgar. -->
  @for (item of reversedHistory(); track $index) {
    <div class="bg-gray-100 p-4 rounded-md shadow-sm flex justify-between items-center gap-4">
      <div class="flex items-baseline gap-2">
        <span class="text-gray-500 text-sm whitespace-nowrap">{{ stateName() }}</span>
        <span class="text-lg font-medium">
          @if (item.isCountIncrement) {
            {{ item.newState && beforeNumber(item.newState) }}
            <span class="text-gray-500">-></span>
          }
          {{ item.newState }}
        </span>
      </div>
      <!--
    <div class="mt-2">
      <h3 class="text-md font-semibold text-gray-700 mb-1">Dependencias:</h3>
      <div class="flex flex-wrap gap-2">
        @for (dependency of item.dependencies; track $index) {
        <span class="px-2 py-1 bg-gray-200 rounded-md text-sm">{{
          dependency
        }}</span>
        }
      </div>
    </div>
    -->
      <div>
        <h3 class="text-md font-semibold text-gray-700 mb-1">Disparo:</h3>
        <div class="flex flex-wrap gap-2">
          <span class="px-2 py-1 bg-gray-200 rounded-md text-sm">{{ item.trigger }}</span>
        </div>
      </div>
    </div>
  } @empty {
    <p
      class="rounded-md border border-dashed border-gray-300 p-4 text-center text-sm text-gray-500"
    >
      Todavía no corrió nada.
    </p>
  }
</div>
