<div class="baliza">
  <div class="baliza__nombre">{{ computedName() }}</div>

  @if (signalsInside().length) {
    <div class="baliza__grupo">
      <h2 class="baliza__rotulo">Signals Inside</h2>
      <div class="baliza__chips">
        @for (dependency of signalsInside(); track $index) {
          <span class="baliza__chip">{{ dependency }}</span>
        }
      </div>
    </div>
  }

  <div class="baliza__grupo">
    <h2 class="baliza__rotulo">Dependencias</h2>
    <div class="baliza__chips">
      @for (dependency of dependencies(); track $index) {
        <span class="baliza__chip">{{ dependency }}</span>
      }
    </div>
  </div>
</div>
