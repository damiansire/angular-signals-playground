<div
  class="inner-box cursor-pointer"
  [class.is-selected]="selected()"
  tabindex="0"
  role="button"
  [attr.aria-pressed]="selectable() ? selected() : null"
  (click)="_onClick()"
  (keydown.enter)="_onClick()"
  (keydown.space)="$event.preventDefault(); _onClick()"
>
  <span>{{ variableName() }}</span>
</div>
