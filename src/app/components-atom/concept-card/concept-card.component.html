<div class="cc" [class.cc--open]="open()">
  <button
    type="button"
    class="cc__mascot"
    [attr.aria-expanded]="open()"
    aria-controls="cc-brief"
    [attr.aria-label]="
      open() ? 'Ocultar la pista de la mascota' : 'La mascota te da una pista de este ejemplo'
    "
    (click)="toggle()"
  >
    <img class="cc__mascot-img" src="angular-mascot-idea.svg" alt="" width="240" height="300" />
    @if (!open()) {
      <span class="cc__hint">tocame</span>
    }
  </button>

  @if (open()) {
    <div class="cc__brief" id="cc-brief">
      <div class="cc__row">
        <span class="cc__chip cc__chip--concept">Concepto</span>
        <p class="cc__text">{{ concept() }}</p>
      </div>
      @if (action()) {
        <div class="cc__row">
          <span class="cc__chip cc__chip--do">Qué hacer</span>
          <p class="cc__text">{{ action() }}</p>
        </div>
      }
      @if (observe()) {
        <div class="cc__row">
          <span class="cc__chip cc__chip--see">Qué observar</span>
          <p class="cc__text">{{ observe() }}</p>
        </div>
      }
    </div>
  }
</div>
