<div class="codigo">
  <!-- La pantalla de la nave, no una ventana de editor: las tres luces son las tres naves. -->
  <div class="codigo__marco" aria-hidden="true">
    <span class="codigo__luz"></span>
    <span class="codigo__luz"></span>
    <span class="codigo__luz"></span>
  </div>
  <div class="p-4">
    @if (isStatic()) {
      @for (item of lines(); track $index) {
        <!-- Modo estático: el snippet se LEE, no se toca. Antes cada línea con texto salía con
             role="button" y tabindex=0 sin ningún handler detrás: el lector de pantalla anunciaba
             un botón, el teclado paraba en él, y activarlo no hacía nada. Un control que miente
             es peor que ninguno. El texto va por binding y no interpolado entre etiquetas: los
             espacios del template se volvían un espacio común delante de la sangría, y al envolver
             el navegador cortaba ahí y dejaba un renglón vacío. -->
        <div
          class="renglon font-mono whitespace-pre-wrap break-words"
          [class]="staticLineClasses(item)"
          [style.--sangria]="sangria(item)"
          [innerHTML]="renglonHtml(item)"
        ></div>
      }
    } @else {
      @for (item of codeLines(); track $index) {
        <div
          class="renglon font-mono whitespace-pre-wrap break-words flex"
          [class]="lineClasses(item)"
          [class.cursor-pointer]="selectBy() === 'Line'"
          [attr.tabindex]="selectBy() === 'Line' ? 0 : null"
          [attr.role]="selectBy() === 'Line' ? 'button' : null"
          (click)="selectBy() === 'Line' ? onLineClick(item) : null"
          (keyup.enter)="selectBy() === 'Line' ? onLineClick(item) : null"
        >
          <div [style.paddingLeft.px]="(item.indent || 0) * characterIndentSize"></div>
          @for (element of item.elements; track $index; let i = $index) {
            <div
              [attr.data-el-id]="element.id"
              [attr.data-el-dueno]="element.dueno"
              [class.token--marcado]="estaMarcado(element)"
              [class.token--sigue]="pegadoAlAnterior(item, i)"
              [class.token--continua]="pegadoAlSiguiente(item, i)"
              class="token"
              [class.cursor-pointer]="isElementClickable(element)"
              [attr.tabindex]="isElementInteractive(element) ? 0 : null"
              [attr.role]="isElementInteractive(element) ? 'button' : null"
              (click)="selectBy() === 'Element' ? onElementClick(item, element) : null"
              (keyup.enter)="selectBy() === 'Element' ? onElementClick(item, element) : null"
            >
              <span [class.palabra-clave]="element.reservedWord">
                {{ element.text }}
              </span>
            </div>
          }
        </div>
      }
    }
  </div>
</div>
