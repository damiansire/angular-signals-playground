<div
  class="caja"
  tabindex="0"
  role="button"
  (click)="onClick()"
  (keyup.enter)="onClick()"
  (keydown.space)="$event.preventDefault()"
  (keyup.space)="onClick()"
>
  <span class="caja__nombre">{{ variableName() }}</span>
  <span #valor class="caja__valor">{{ variableValue() }}</span>
</div>
