<section class="ms">
  <p class="ms__eyebrow">{{ healthy() ? 'Desafío · sano' : 'Desafío · tocá el código' }}</p>

  <div class="ms__code">
    @for (line of lines(); track $index) {
      <!-- El texto va por binding de propiedad, no por interpolación entre etiquetas: el formateador
           mueve los saltos de línea y con `white-space: pre` esos saltos se verían como sangría. -->
      <div class="ms__line" [class.ms__line--dead]="line.dead">
        <span class="ms__indent" [textContent]="line.indent"></span>
        @if (line.knob) {
          <button
            type="button"
            class="ms__knob"
            [attr.aria-label]="knobLabel(line.knob)"
            [textContent]="line.body"
            (click)="move(line.knob)"
          ></button>
        } @else {
          <span [textContent]="line.body"></span>
        }
      </div>
    }
  </div>

  <!-- La lectura es lo único que le contesta al usuario, así que también tiene que ANUNCIARSE:
       sin aria-live, quien usa lector de pantalla mueve la perilla y no se entera de nada. -->
  <div class="ms__bar">
    <!-- El role="status" va en un envoltorio, NO en el <ul>: puesto en la lista le pisa el
         role=list y sus <li> quedan huérfanos (lo detectó axe-core en los specs del repo). -->
    <div role="status" aria-live="polite">
      <ul class="ms__gauges">
        @for (gauge of gauges(); track gauge.id) {
          <li
            class="ms__gauge"
            [class.ms__gauge--ok]="health() === 'healthy'"
            [class.ms__gauge--idle]="health() === 'idle'"
          >
            <span class="ms__gauge-label">{{ gauge.label }}</span>
            <b class="ms__gauge-value">{{ gauge.value }}</b>
          </li>
        }
      </ul>
    </div>

    <button type="button" class="ms__act" (click)="press()">{{ system().action }}</button>
  </div>

  <!-- La ayuda al fallar: orienta hacia dónde mirar sin decir qué tocar. Al
       acertar no hay nada: la lectura sana es la única respuesta. Tiene su propia región viva para
       que quien usa lector de pantalla también la escuche, una vez. -->
  <div class="ms__pista-zona" aria-live="polite">
    @if (health() === 'broken') {
      <p class="ms__pista">
        <img
          class="ms__pista-mascota"
          src="angular-mascot-idea.svg"
          alt=""
          width="240"
          height="300"
        />
        Esa no era. Mirá la lectura.
      </p>
    }
  </div>
</section>
