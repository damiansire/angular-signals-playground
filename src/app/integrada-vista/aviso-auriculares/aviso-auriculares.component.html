<div class="aa__cielo" aria-hidden="true">
  <svg class="aa__estrellas" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMin slice">
    @for (e of estrellas; track $index) {
      <circle
        class="aa__estrella"
        [attr.cx]="e.x"
        [attr.cy]="e.y"
        [attr.r]="e.r"
        [style.animation-delay.s]="-e.retraso"
      />
    }
  </svg>
</div>
<!-- Arriba y aparte, para que tocar en cualquier lado siga siendo "continuar". -->
<button
  class="aa__mudo"
  type="button"
  [attr.aria-pressed]="!conSonido()"
  (click)="alternarSonido($event)"
>
  <svg class="aa__parlante" viewBox="0 0 48 40" aria-hidden="true">
    <path class="aa__parlante-cuerpo" d="M5 14h9l11-9v30l-11-9H5a2 2 0 01-2-2v-8a2 2 0 012-2z" />
    <g class="aa__parlante-ondas" fill="none" stroke-linecap="round">
      <path d="M31 14q5 6 0 12" />
      <path d="M36 9q10 11 0 22" />
    </g>
    <g class="aa__parlante-cruz" fill="none" stroke-linecap="round">
      <path d="M32 14l11 12" />
      <path d="M43 14l-11 12" />
    </g>
  </svg>
  <span>{{ conSonido() ? 'Sonido' : 'Sin sonido' }}</span>
</button>

<div class="aa__centro">
  <div class="aa__escena" aria-hidden="true">
    <div class="aa__halo"></div>
    <div class="aa__piso"></div>
    <app-mascota-viva
      #angie
      class="aa__angie"
      [vidaPropia]="momento() === 'esperando' && !conSonido()"
    >
      <!-- La vincha pasa por detrás de la cabeza y apoya en la punta de arriba. -->
      <svg:g mvDetras>
        <defs>
          <linearGradient
            id="aa-banda"
            x1="0"
            y1="60"
            x2="0"
            y2="440"
            gradientUnits="userSpaceOnUse"
          >
            <stop offset="0" stop-color="#5a4775" />
            <stop offset="1" stop-color="#2b1b33" />
          </linearGradient>
          <linearGradient
            id="aa-copa"
            x1="0"
            y1="-78"
            x2="0"
            y2="78"
            gradientUnits="userSpaceOnUse"
          >
            <stop offset="0" stop-color="#ff5fa8" />
            <stop offset="1" stop-color="#b0004f" />
          </linearGradient>
          <!-- El vidrio refleja el alba que viene: oscuro arriba, rosa abajo. -->
          <linearGradient
            id="aa-vidrio"
            x1="0"
            y1="-36"
            x2="0"
            y2="44"
            gradientUnits="userSpaceOnUse"
          >
            <stop offset="0" stop-color="#1b1030" />
            <stop offset=".55" stop-color="#3b1650" />
            <stop offset="1" stop-color="#d4206f" />
          </linearGradient>
          <clipPath id="aa-lentes">
            <path [attr.d]="lenteIzquierdo" />
            <path [attr.d]="lenteDerecho" />
          </clipPath>
        </defs>
        <path
          d="M276 380C250 40 930 60 912 440"
          fill="none"
          stroke="url(#aa-banda)"
          stroke-width="40"
          stroke-linecap="round"
        />
        <path
          d="M368 196Q590 60 812 214"
          fill="none"
          stroke="#fff"
          stroke-opacity=".2"
          stroke-width="9"
          stroke-linecap="round"
        />
      </svg:g>

      <!-- Los lentes siguen a la cara, inclinados como ella; las cejas asoman por arriba. -->
      <svg:g mvCara class="aa__lentes" transform="translate(533 617) rotate(6.7)">
        <g fill="none" stroke="#1a0f22" stroke-width="9" stroke-linecap="round">
          <path d="M-132 -30L-178 -38" />
          <path d="M132 -30L198 -42" />
          <path d="M-12 -24Q0 -33 12 -24" />
        </g>
        <path
          [attr.d]="lenteIzquierdo"
          fill="url(#aa-vidrio)"
          stroke="#1a0f22"
          stroke-width="8"
          stroke-linejoin="round"
        />
        <path
          [attr.d]="lenteDerecho"
          fill="url(#aa-vidrio)"
          stroke="#1a0f22"
          stroke-width="8"
          stroke-linejoin="round"
        />
        <!-- El destello cruza los dos vidrios, recortado a ellos: de vez en cuando, y fuerte en el acorde. -->
        <g clip-path="url(#aa-lentes)">
          <g class="aa__destello" fill="#fff">
            <path d="M-150 -40h26l-44 90h-26z" opacity=".55" />
            <path d="M-112 -40h10l-44 90h-10z" opacity=".4" />
          </g>
          <g fill="#fff" opacity=".22">
            <path d="M-118 -30h18l-12 24h-18z" />
            <path d="M28 -30h18l-12 24h-18z" />
          </g>
        </g>
      </svg:g>

      <svg:g mvDelante>
        <!-- Ondas y notas salen del lado que suena: en espera laten suaves. -->
        <g
          class="aa__ondas aa__ondas--izquierda"
          fill="none"
          stroke="#ffd46a"
          stroke-linecap="round"
        >
          <path class="aa__onda" stroke-width="12" d="M206 360Q186 405 206 450" />
          <path class="aa__onda" stroke-width="10" d="M176 338Q148 405 176 472" />
          <path class="aa__onda" stroke-width="8" d="M146 316Q110 405 146 494" />
        </g>
        <g class="aa__ondas aa__ondas--derecha" fill="none" stroke="#ffd46a" stroke-linecap="round">
          <path class="aa__onda" stroke-width="12" d="M988 395Q1008 440 988 485" />
          <path class="aa__onda" stroke-width="10" d="M1018 373Q1046 440 1018 507" />
          <path class="aa__onda" stroke-width="8" d="M1048 351Q1084 440 1048 529" />
        </g>

        <g transform="translate(276 405) rotate(-10)">
          <g class="aa__copa aa__copa--izquierda">
            <rect x="-48" y="-76" width="96" height="152" rx="46" fill="url(#aa-copa)" />
            <rect x="30" y="-60" width="26" height="120" rx="13" fill="#f6dbe9" />
            <path
              d="M-30 -42Q-28 -60 -10 -64"
              fill="none"
              stroke="#fff"
              stroke-opacity=".55"
              stroke-width="9"
              stroke-linecap="round"
            />
            <text class="aa__letra" x="-6" y="22">L</text>
          </g>
        </g>
        <g transform="translate(918 440) rotate(14)">
          <g class="aa__copa aa__copa--derecha">
            <rect x="-48" y="-76" width="96" height="152" rx="46" fill="url(#aa-copa)" />
            <rect x="-56" y="-60" width="26" height="120" rx="13" fill="#f6dbe9" />
            <path
              d="M-24 -42Q-22 -60 -4 -64"
              fill="none"
              stroke="#fff"
              stroke-opacity=".55"
              stroke-width="9"
              stroke-linecap="round"
            />
            <text class="aa__letra" x="6" y="22">R</text>
          </g>
        </g>

        <g class="aa__notas aa__notas--izquierda" fill="#ffd46a">
          <g class="aa__nota">
            <ellipse cx="222" cy="300" rx="16" ry="12" transform="rotate(-20 222 300)" />
            <path d="M234 296V246l20 8" fill="none" stroke="#ffd46a" stroke-width="6" />
          </g>
          <g class="aa__nota">
            <ellipse cx="300" cy="284" rx="14" ry="10" transform="rotate(-20 300 284)" />
            <path d="M310 280V236" fill="none" stroke="#ffd46a" stroke-width="6" />
          </g>
        </g>
        <g class="aa__notas aa__notas--derecha" fill="#ffd46a">
          <g class="aa__nota">
            <ellipse cx="900" cy="320" rx="14" ry="10" transform="rotate(-20 900 320)" />
            <path d="M910 316V272" fill="none" stroke="#ffd46a" stroke-width="6" />
          </g>
          <g class="aa__nota">
            <ellipse cx="972" cy="336" rx="16" ry="12" transform="rotate(-20 972 336)" />
            <path d="M984 332V282l20 8" fill="none" stroke="#ffd46a" stroke-width="6" />
          </g>
        </g>
      </svg:g>
    </app-mascota-viva>
  </div>

  <h2 id="aa-titulo" class="aa__titulo">
    Ponete <em class="aa__clave">auriculares</em> y subí el <em class="aa__clave">volumen</em>
  </h2>
  <!-- La invitación y el lado que suena comparten lugar: uno se va cuando llega el otro, y el bloque
       no carga un renglón vacío que lo descentra. -->
  <div class="aa__pie">
    <!-- No es un botón a la vista: es la invitación a tocar donde sea. Sigue siendo un botón para el
       teclado y el lector, que no tienen "cualquier lado". -->
    <!-- Las dos frases están, y el CSS muestra la que corresponde: con mouse se hace click, en
         una pantalla táctil se toca. Cada una lleva su nombre para el lector. -->
    <button #seguir class="aa__seguir" type="button">
      <span class="sr-only aa__con-mouse">{{ llamado }}</span>
      <span class="sr-only aa__tactil">{{ llamadoTactil }}</span>
      <!-- El cursor hace click y la ola sale de ahí: es la causa de que la frase se mueva. -->
      <span class="aa__raton" aria-hidden="true">
        <i></i><i></i>
        <svg viewBox="0 0 24 30">
          <path d="M3 2V24L8.6 18.8L12.6 27.6L16.8 25.8L12.8 17.2H20.6Z" />
        </svg>
      </span>
      <span class="aa__frase aa__con-mouse" aria-hidden="true">
        @for (palabra of letras; track $index) {
          <span class="aa__palabra">
            @for (l of palabra; track $index) {
              <span class="aa__letra-ola" [style.--i]="l.i">{{ l.c }}</span>
            }
          </span>
        }
      </span>
      <span class="aa__frase aa__tactil" aria-hidden="true">
        @for (palabra of letrasTactil; track $index) {
          <span class="aa__palabra">
            @for (l of palabra; track $index) {
              <span class="aa__letra-ola" [style.--i]="l.i">{{ l.c }}</span>
            }
          </span>
        }
      </span>
    </button>
    <p class="aa__lado" aria-live="polite">
      @switch (suena()) {
        @case ('izquierda') {
          Izquierda…
        }
        @case ('derecha') {
          …derecha
        }
        @case ('ambos') {
          ¡Listo!
        }
      }
    </p>
  </div>
</div>
