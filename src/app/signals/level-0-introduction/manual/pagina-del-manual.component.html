<article #marco class="pm">
  <!-- La ley va suelta sobre el cielo, también con la consola en la pantalla de la nave: adentro de
       la pantalla, como barra de título, la encerraba todo en un recuadro y se leía como un modal.
       Con la portada no se repite: la portada es la ley. -->
  @if (!enPortada()) {
    <header class="pm-cabeza">
      @if (datos; as d) {
        <p class="pm-ley">Ley {{ d.numero }}</p>
        <h2 class="pm-titulo" id="manual-ley">{{ d.ley }}</h2>
        @if (enPantalla()) {
          <p class="pm-cabeza-nave">{{ d.enLaNave }}</p>
        }
        @if (d.marcas) {
          <ng-container [ngTemplateOutlet]="d.marcas" />
        }
      }
    </header>
  }

  <!-- Las piezas que se mueven de lugar según dónde va la consola: abajo, o adentro de la pantalla
       de la nave. Cada una se instancia en un solo lugar. Probar y arreglar son dos pasos del mismo
       código. -->
  <ng-template #pasos>
    <li
      class="pm-etapa"
      [class.pm-etapa--ahora]="paso() === 1 && !resuelta()"
      [class.pm-etapa--hecho]="paso() > 1 || resuelta()"
    >
      <span class="pm-num" aria-hidden="true">1</span>
      <ng-content select="[hacer]" />
    </li>
    <li
      class="pm-etapa"
      [class.pm-etapa--ahora]="paso() === 2 && !resuelta()"
      [class.pm-etapa--hecho]="resuelta()"
    >
      <span class="pm-num" aria-hidden="true">2</span>
      <ng-content select="[arreglo]" />
    </li>
  </ng-template>
  <ng-template #mostrame>
    @if (guia() !== null || mostrando()) {
      <button type="button" class="pm-mostrar" [disabled]="mostrando()" (click)="mostrar()">
        <span aria-hidden="true">&#9654;</span> Mostrame
      </button>
    }
  </ng-template>
  <ng-template #paginas>
    @if (datos?.pie; as p) {
      <ng-container [ngTemplateOutlet]="p" />
    }
  </ng-template>
  <ng-template #consola><ng-content select="[consola]" /></ng-template>
  <!-- En la pantalla de la nave la página pone sus botones: "Siguiente" es de la nave (ver `seguir`). -->
  <ng-template #volver>
    @if (datos?.atras?.(); as texto) {
      <button type="button" class="pm-atras" (click)="datos?.pasar?.(-1)">
        &larr; {{ texto }}
      </button>
    }
  </ng-template>

  <!-- Una sola pieza: la nave es el escenario y su pantalla muestra lo que pasa. -->
  <section class="pm-escenario">
    <figure class="pm-ventana">
      <ng-content select="[escena]" />
      @if (enPantalla()) {
        @if (!enPortada()) {
          <div class="pm-carril" [class.pm-carril--yendo]="yendo()">
            <!-- Lo que hay que hacer lo dice la nave, con su ayuda al pie: cambia de paso, y el globo
                 salta. -->
            <div class="pm-globo" aria-live="polite">
              <ol class="pm-etapas">
                <ng-container [ngTemplateOutlet]="pasos" />
              </ol>
              <ng-container [ngTemplateOutlet]="mostrame" />
            </div>
            <!-- Cumplida la página, la nave puede seguir viaje: un vidrio que late, con flechas que
                 corren hacia adelante. Tocarlo la hace salir volando, y la página siguiente la
                 recibe desde la izquierda. -->
            @if (datos?.siguiente?.(); as texto) {
              <button
                type="button"
                class="pm-seguir"
                [class.pm-seguir--yendo]="yendo()"
                [disabled]="yendo()"
                (click)="seguir()"
              >
                <span class="pm-seguir-texto">{{ texto }}</span>
                <span class="pm-seguir-flechas" aria-hidden="true">
                  <span style="--i: 0">&rsaquo;</span><span style="--i: 1">&rsaquo;</span
                  ><span style="--i: 2">&rsaquo;</span>
                </span>
              </button>
            }
          </div>
        }
        <div #pantalla class="pm-pantalla" data-pantalla>
          @if (enPortada()) {
            <div class="pm-portada">
              <ng-content select="[portada]" />
              @if (datos; as d) {
                <p class="pm-ley">Ley {{ d.numero }}</p>
                <h2 class="pm-portada-titulo" id="manual-ley">{{ d.ley }}</h2>
                <p class="pm-portada-nave">{{ d.enLaNave }}</p>
                @if (d.marcas) {
                  <ng-container [ngTemplateOutlet]="d.marcas" />
                }
              }
              <div class="pm-portada-botones">
                <ng-container [ngTemplateOutlet]="volver" />
                <button type="button" class="pm-leer" (click)="leer()">
                  Leer <span aria-hidden="true">&rarr;</span>
                </button>
              </div>
            </div>
          } @else {
            <ng-container [ngTemplateOutlet]="consola" />
            <!-- Volver, como pestaña sobre el borde de abajo de la pantalla. -->
            <nav class="pm-paginas" aria-label="Páginas">
              <ng-container [ngTemplateOutlet]="volver" />
            </nav>
          }
        </div>
      } @else {
        @if (datos; as d) {
          <figcaption class="pm-nave">{{ d.enLaNave }}</figcaption>
        }
      }
    </figure>

    @if (!enPantalla()) {
      <div class="pm-consola">
        <ol class="pm-etapas">
          <ng-container [ngTemplateOutlet]="pasos" />
          <!-- Los botones de página y "Mostrame" mientras haga falta. "Siguiente" llega recién con
               la página cumplida, en el lugar de "Mostrame": en su propia fila, abajo, se podía
               pasar sin hacer nada. -->
          <li class="pm-etapas-boton">
            <ng-container [ngTemplateOutlet]="paginas" />
            <ng-container [ngTemplateOutlet]="mostrame" />
          </li>
        </ol>
        <ng-container [ngTemplateOutlet]="consola" />
      </div>
    }
  </section>

  <app-mano-guia [punta]="punta()" />
</article>
