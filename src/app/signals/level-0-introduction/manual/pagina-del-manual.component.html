<article #marco class="pm">
  <header class="pm-cabeza">
    @if (datos; as d) {
      <p class="pm-ley">Ley {{ d.numero }}</p>
      <h2 class="pm-titulo" id="manual-ley">{{ d.ley }}</h2>
      @if (d.marcas) {
        <ng-container [ngTemplateOutlet]="d.marcas" />
      }
    }
  </header>

  <!-- Una sola pieza: la nave es el escenario y su pantalla muestra lo que pasa; abajo, su consola,
       con lo que se toca. Probar y arreglar son dos pasos de la misma consola. -->
  <section class="pm-escenario">
    <figure class="pm-ventana">
      <ng-content select="[escena]" />
      @if (datos; as d) {
        <figcaption class="pm-nave">{{ d.enLaNave }}</figcaption>
      }
    </figure>

    <div class="pm-consola">
      <ol class="pm-etapas">
        <li
          class="pm-etapa"
          [class.pm-etapa--ahora]="paso() === 1 && !resuelta()"
          [class.pm-etapa--hecho]="paso() > 1 || resuelta()"
        >
          <span class="pm-num" aria-hidden="true">1</span>
          <ng-content select="[hacer]" />
        </li>
        <li
          class="pm-etapa"
          [class.pm-etapa--ahora]="paso() === 2 && !resuelta()"
          [class.pm-etapa--hecho]="resuelta()"
        >
          <span class="pm-num" aria-hidden="true">2</span>
          <ng-content select="[arreglo]" />
        </li>
        <!-- Los botones de página y "Mostrame" mientras haga falta. "Siguiente" llega recién con la
             página cumplida, en el lugar de "Mostrame": en su propia fila, abajo, se podía pasar sin
             hacer nada. -->
        <li class="pm-etapas-boton">
          @if (datos?.pie; as p) {
            <ng-container [ngTemplateOutlet]="p" />
          }
          @if (guia() !== null || mostrando()) {
            <button type="button" class="pm-mostrar" [disabled]="mostrando()" (click)="mostrar()">
              <span aria-hidden="true">&#9654;</span> Mostrame
            </button>
          }
        </li>
      </ol>
      <ng-content select="[consola]" />
    </div>
  </section>

  <app-mano-guia [punta]="punta()" />
</article>
