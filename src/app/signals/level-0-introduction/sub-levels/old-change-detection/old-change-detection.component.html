<section class="ocd">
  <!-- Sin bajada: tocás una API parcheada y el árbol entero se prende. Eso ES "los reviso a
       todos", y el contador lo confirma en N/N. -->
  <header class="ocd-head">
    <h2 class="ocd-title">Zone.js revisa todo el árbol.</h2>
  </header>

  <!-- El rótulo visible salía sobrando: el grupo ya se anuncia por su aria-label. -->
  <div class="ocd-apis" role="group" aria-label="APIs que Zone.js parchea">
    @for (api of patchedApis; track api) {
      <button class="ocd-api" (click)="trigger(api)">{{ api }}</button>
    }
  </div>

  <div class="ocd-stage">
    <svg
      class="ocd-tree"
      viewBox="0 0 340 240"
      role="img"
      aria-label="Árbol DOM: Zone.js re-chequea todos los nodos"
    >
      @for (path of edgePaths; track path) {
        <path class="ocd-edge" [attr.d]="path" />
      }
      @for (node of nodes; track node.id) {
        <g class="ocd-node" [class.ocd-swept]="swept()">
          <circle
            [attr.cx]="node.x"
            [attr.cy]="node.y"
            r="15"
            [style.transition-delay]="node.depth * 0.15 + 's'"
          />
          <text [attr.x]="node.x" [attr.y]="node.y + 4" text-anchor="middle">{{ node.label }}</text>
        </g>
      }
    </svg>

    <div class="ocd-readout">
      @if (lastTrigger()) {
        <p class="ocd-fired">
          <code>{{ lastTrigger() }}</code> →
        </p>
      }
      <p class="ocd-count">
        re-chequeados
        <strong>{{ rechecked() }} / {{ total }}</strong>
      </p>
      <button class="ocd-reset" (click)="reset()">Reiniciar</button>
    </div>
  </div>
</section>

<app-manipulable-system [system]="closingSystem" />
