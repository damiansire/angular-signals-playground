<app-pagina-del-manual [guia]="guia()" [respiro]="900" [paso]="paso()" [resuelta]="sano()">
  <p hacer>Tocá los tags.</p>
  <p arreglo class="htt-arreglo">Mové el <code>&lt;/article&gt;</code>.</p>

  <app-escena-arbol escena [reveladas]="reveladas()" [fuera]="fuera()" [sano]="sano()" />

  <!-- El árbol se ve una sola vez, en la pantalla de la nave. Acá va lo que se toca: el HTML, con
       cada tag que abre como botón y el cierre fuera de lugar como hueco. -->
  <section consola class="htt">
    <div class="htt-codigo" role="group" aria-label="El HTML de la pantalla">
      @for (r of renglones(); track $index) {
        <span class="htt-linea" [style.padding-left.ch]="r.sangria * 2">
          @for (p of r.piezas; track $index) {
            @switch (p.tipo) {
              @case ('abre') {
                <button
                  type="button"
                  class="htt-tag"
                  [class.htt-tag--visto]="revelada(p.id)"
                  [attr.aria-pressed]="revelada(p.id)"
                  [attr.data-guia]="'abre-' + p.id"
                  (click)="revelar(p.id)"
                >
                  {{ p.texto }}
                </button>
              }
              @case ('hueco') {
                <button
                  type="button"
                  class="htt-hueco"
                  [class.htt-hueco--ahora]="paso() === 2 && !arreglado()"
                  [class.htt-hueco--movido]="arreglado()"
                  [attr.aria-pressed]="arreglado()"
                  data-guia="cierre"
                  (click)="moverCierre()"
                >
                  {{ p.texto }}
                </button>
              }
              @case ('texto') {
                <span class="htt-texto">{{ p.texto }}</span>
              }
              @default {
                <span class="htt-cierra">{{ p.texto }}</span>
              }
            }
          }
        </span>
      }
    </div>
  </section>
</app-pagina-del-manual>
