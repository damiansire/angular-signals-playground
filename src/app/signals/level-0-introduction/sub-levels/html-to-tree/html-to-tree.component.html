<section class="htt">
  <header class="htt-head">
    <p class="htt-eyebrow">el browser lee tu HTML</p>
    <h2 class="htt-title">El HTML es un árbol de nodos.</h2>
    <p class="htt-sub">
      El browser parsea el texto y arma el DOM: un árbol. Leelo de corrido, o clickeá un tag y mirá
      aparecer su nodo.
    </p>
    <button class="htt-play" (click)="playParse()" [disabled]="parsePlaying()">
      {{ parsePlaying() ? 'Leyendo…' : 'Leer el HTML' }}
    </button>
  </header>

  <app-two-column-layout title="">
    <app-tree
      [nodesToShow]="nodesToShow()"
      [htmlCode]="htmlCode"
      [mirror]="true"
      (viewChanged)="followTick()"
      right
    ></app-tree>
    <app-code
      textSize="text-xl"
      (codeClick)="codeClickHandler($event)"
      (htmlParsed)="onParsedCodeHandler()"
      [htmlCode]="htmlCode"
      left
    ></app-code>
    <svg
      #overlay
      overlay
      class="pointer-events-none absolute inset-0 h-full w-full"
      aria-hidden="true"
    >
      @for (line of connectors(); track line.id) {
        <path
          class="connector"
          [attr.d]="line.path"
          fill="none"
          [attr.stroke]="line.color"
          [style.color]="line.color"
          stroke-width="2.5"
          stroke-dasharray="6 8"
          stroke-linecap="round"
          opacity="0.9"
        />
      }
    </svg>
  </app-two-column-layout>
</section>
