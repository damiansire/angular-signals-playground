<app-pagina-del-manual [guia]="guia()" [llena]="true">
  <p hacer class="htt-hacer">Tocá un tag del código.</p>

  <!-- El código y el árbol, uno al lado del otro y con el alto de la mesa: cada tag tocado tira su
       conector hasta su nodo, que queda en el mismo orden vertical que el código. -->
  <div demo class="htt">
    <app-code
      class="htt-codigo"
      textSize="text-xl"
      (codeClick)="codeClickHandler($event)"
      [htmlCode]="htmlCode"
    ></app-code>
    <app-tree class="htt-arbol" [nodesToShow]="nodesToShow()" [htmlCode]="htmlCode"></app-tree>
    <svg #overlay class="htt-conectores" aria-hidden="true">
      @for (line of connectors(); track line.id) {
        <path
          class="connector"
          [attr.d]="line.path"
          fill="none"
          [attr.stroke]="line.color"
          [style.color]="line.color"
          stroke-width="2.5"
          stroke-dasharray="6 8"
          stroke-linecap="round"
          opacity="0.9"
        />
      }
    </svg>
  </div>

  <app-escena-arbol escena [reveladas]="reveladas()" [sano]="sano()" />

  <app-manipulable-system
    desafio
    [system]="closingSystem"
    (corrida)="sano.set($event.salud === 'healthy')"
  />
</app-pagina-del-manual>
