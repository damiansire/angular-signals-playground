<app-pagina-del-manual
  [guia]="guia()"
  [respiro]="900"
  [paso]="paso()"
  [resuelta]="sano()"
  [enPantalla]="true"
  [portada]="true"
  (seAbre)="abierta.set(true)"
>
  <!-- La portada: el árbol que la página enseña, ya armado, crece desde la raíz. -->
  <svg portada class="htt-portada" viewBox="0 0 300 128" aria-hidden="true">
    @for (n of portada; track n.id) {
      @if (n.rama) {
        <path class="htt-portada-rama" [attr.d]="n.rama" pathLength="1" [style.--i]="n.orden" />
      }
    }
    @for (n of portada; track n.id) {
      <g [attr.transform]="'translate(' + n.x + ' ' + n.y + ')'">
        <g class="htt-portada-nodo" [style.--i]="n.orden">
          <rect
            x="-27"
            y="-11"
            width="54"
            height="22"
            rx="11"
            [attr.fill]="n.color.fondo"
            [class.htt-portada-oscuro]="n.color.oscuro"
          />
          <text text-anchor="middle" dominant-baseline="central" [attr.fill]="n.color.letra">
            {{ n.tag }}
          </text>
        </g>
      </g>
    }
  </svg>

  <p hacer>Tocá los tags.</p>
  <p arreglo class="htt-arreglo">Mové el <code>&lt;/article&gt;</code>.</p>

  <app-escena-arbol
    escena
    [render]="render"
    [abierta]="abierta()"
    [reveladas]="reveladas()"
    [fuera]="fuera()"
    [sano]="sano()"
  />

  <!-- La pantalla de la nave, en tres columnas: el HTML, con cada tag que abre como botón y el
       cierre fuera de lugar como hueco (cada renglón se marca cuando su pieza ya está dibujada); el
       mismo HTML como árbol de nodos, que es como se lee; y lo que se dibuja (`escena-arbol`). -->
  <section consola class="htt">
    <div class="htt-codigo" role="group" aria-label="El HTML de la pantalla">
      @for (r of renglones(); track $index) {
        <span
          class="htt-linea"
          [class.htt-linea--vista]="r.estado === 'visto'"
          [class.htt-linea--afuera]="r.estado === 'afuera'"
          [class.htt-linea--destino-adentro]="destinoEn(r.abre) === 'adentro'"
          [class.htt-linea--destino-debajo]="destinoEn(r.abre) === 'debajo'"
          [attr.data-abre]="r.abre"
          [style.--sangria.ch]="r.sangria * 2"
        >
          @for (p of r.piezas; track $index) {
            @switch (p.tipo) {
              @case ('abre') {
                <button
                  type="button"
                  class="htt-tag"
                  [class.htt-tag--visto]="revelada(p.id)"
                  [attr.aria-pressed]="revelada(p.id)"
                  [attr.data-guia]="'abre-' + p.id"
                  (click)="revelar(p.id)"
                >
                  {{ p.texto }}
                </button>
              }
              @case ('hueco') {
                <!-- Se arrastra a otro renglón; también se toca (lo lleva a su lugar o lo
                     devuelve) o se mueve con las flechas. -->
                <button
                  type="button"
                  class="htt-hueco"
                  [class.htt-hueco--ahora]="paso() === 2 && !arreglado()"
                  [class.htt-hueco--movido]="arreglado()"
                  [class.htt-hueco--arrastrando]="arrastre() !== null"
                  [style.--arrastre.px]="arrastre()?.dy"
                  [attr.aria-pressed]="arreglado()"
                  aria-label="Mover el cierre de article: arrastralo, tocalo o usá las flechas"
                  data-guia="cierre"
                  (click)="moverCierre()"
                  (keydown)="teclaDelCierre($event)"
                  (pointerdown)="agarrarCierre($event)"
                  (pointermove)="arrastrarCierre($event)"
                  (pointerup)="soltarCierre($event)"
                  (pointercancel)="cancelarArrastre()"
                  (lostpointercapture)="cancelarArrastre()"
                >
                  {{ p.texto }}
                </button>
              }
              @case ('texto') {
                <span class="htt-texto">{{ p.texto }}</span>
              }
              @default {
                <span class="htt-cierra">{{ p.texto }}</span>
              }
            }
          }
        </span>
      }
    </div>

    @let a = arbol();
    <svg
      class="htt-arbol"
      [attr.viewBox]="'-4 -4 ' + (a.ancho + 8) + ' ' + (a.alto + 8)"
      [style.aspect-ratio]="(a.ancho + 8) / (a.alto + 8)"
      role="img"
      [attr.aria-label]="descripcionDelArbol()"
    >
      @for (n of a.nodos; track n.id) {
        @if (n.rama) {
          <path
            class="htt-rama"
            [class.htt-rama--vista]="n.visto || n.fantasma"
            [class.htt-rama--afuera]="n.afuera"
            [style.d]="n.rama"
            pathLength="1"
          />
        }
      }
      @for (n of a.nodos; track n.id) {
        <g
          class="htt-nodo"
          [class.htt-nodo--visto]="n.visto"
          [class.htt-nodo--fantasma]="n.fantasma"
          [class.htt-nodo--afuera]="n.afuera"
          [class.htt-nodo--oscuro]="n.visto && n.oscuro"
          [style.transform]="'translate(' + n.x + 'px, ' + n.y + 'px)'"
        >
          <rect
            [attr.x]="-a.nodo.ancho / 2"
            [attr.y]="-a.nodo.alto / 2"
            [attr.width]="a.nodo.ancho"
            [attr.height]="a.nodo.alto"
            rx="12"
            [attr.fill]="n.visto ? n.color.fondo : 'none'"
          />
          <text
            text-anchor="middle"
            dominant-baseline="central"
            [attr.fill]="n.visto ? n.color.letra : '#b9aee0'"
          >
            {{ n.tag }}
          </text>
        </g>
      }
    </svg>

    <svg #render class="htt-render" viewBox="214 26 174 178" aria-hidden="true"></svg>
  </section>
</app-pagina-del-manual>
