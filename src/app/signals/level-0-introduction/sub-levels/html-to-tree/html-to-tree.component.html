<app-pagina-del-manual>
  <p hacer class="htt-hacer">Tocá un tag del código.</p>
  <button hacer class="htt-play" (click)="playParse()" [disabled]="parsePlaying()">
    {{ parsePlaying() ? 'Leyendo…' : 'Leer el HTML' }}
  </button>

  <app-two-column-layout demo class="htt" title="">
    <app-tree
      [nodesToShow]="nodesToShow()"
      [htmlCode]="htmlCode"
      [mirror]="true"
      (viewChanged)="followTick()"
      right
    ></app-tree>
    <app-code
      textSize="text-xl"
      (codeClick)="codeClickHandler($event)"
      [htmlCode]="htmlCode"
      left
    ></app-code>
    <svg
      #overlay
      overlay
      class="pointer-events-none absolute inset-0 h-full w-full"
      aria-hidden="true"
    >
      @for (line of connectors(); track line.id) {
        <path
          class="connector"
          [attr.d]="line.path"
          fill="none"
          [attr.stroke]="line.color"
          [style.color]="line.color"
          stroke-width="2.5"
          stroke-dasharray="6 8"
          stroke-linecap="round"
          opacity="0.9"
        />
      }
    </svg>
  </app-two-column-layout>

  <app-escena-arbol escena [reveladas]="reveladas()" [sano]="sano()" />

  <app-manipulable-system
    desafio
    [system]="closingSystem"
    (corrida)="sano.set($event.salud === 'healthy')"
  />
</app-pagina-del-manual>
