<app-pagina-del-manual
  [guia]="guia()"
  [respiro]="1600"
  [integrada]="true"
  [paso]="paso()"
  [resuelta]="sano()"
>
  <p hacer>Corré.</p>
  <p arreglo>Hacelo signal.</p>

  <app-escena-signal escena [aviso]="aviso()" [valor]="arbol().total" [sano]="sano()" />

  <!-- El árbol y cuántos nodos se revisaron se ven una sola vez, en la pantalla de la nave. Acá va
       lo que se toca: el código, con la declaración como hueco, y la corrida. -->
  <section consola class="scd">
    <div class="scd-codigo" role="group" aria-label="El código que cambia el valor">
      <button
        type="button"
        class="scd-hueco"
        [class.scd-hueco--signal]="declaracion().esSignal"
        [attr.aria-label]="'Cambiar la declaración: ' + declaracion().renglon"
        data-guia="declaracion"
        (click)="cambiarDeclaracion()"
      >
        <span class="scd-linea" [innerHTML]="renglonDeLaDeclaracion()"></span>
      </button>
      <span class="scd-linea" [innerHTML]="escritura()"></span>
    </div>

    <div class="scd-mando">
      <button
        type="button"
        class="scd-correr"
        [attr.data-cuenta]="arbol().total"
        (click)="correrCodigo()"
      >
        &#9654; correr
      </button>
    </div>
  </section>
</app-pagina-del-manual>
