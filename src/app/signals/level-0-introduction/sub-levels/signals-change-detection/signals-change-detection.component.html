<section class="scd">
  <!-- Sin bajada: al cambiar el signal se prenden dos nodos y el resto del árbol se poda a la
       vista. La comparación contra Zone.js queda como dos números, no como una frase. -->
  <header class="scd-head">
    <h2 class="scd-title">El signal avisa quién lo lee.</h2>
  </header>

  <div class="scd-actions">
    <button class="scd-change" (click)="changeSignal()">count.set(1)</button>
    <button class="scd-reset" (click)="reset()">Reiniciar</button>
  </div>

  <div class="scd-stage">
    <svg
      class="scd-tree"
      viewBox="0 0 340 240"
      role="img"
      aria-label="Árbol DOM: con signals solo se re-chequean los nodos dependientes"
    >
      @for (path of edgePaths; track path) {
        <path class="scd-edge" [attr.d]="path" />
      }
      @for (node of nodes; track node.id) {
        <g
          class="scd-node"
          [class.scd-lit]="changed() && isDependent(node.id)"
          [class.scd-pruned]="changed() && !isDependent(node.id)"
        >
          <circle [attr.cx]="node.x" [attr.cy]="node.y" r="15" />
          <text [attr.x]="node.x" [attr.y]="node.y + 4" text-anchor="middle">{{ node.label }}</text>
        </g>
      }
    </svg>

    <div class="scd-readout">
      <p class="scd-count">
        re-chequeados
        <strong>{{ changed() ? recheckedSignals : 0 }} / {{ recheckedZone }}</strong>
      </p>
      @if (changed()) {
        <p class="scd-contrast">
          <span
            >Zone.js <strong>{{ recheckedZone }}</strong></span
          >
          <span
            >signal <strong>{{ recheckedSignals }}</strong></span
          >
        </p>
      }
    </div>
  </div>
</section>
