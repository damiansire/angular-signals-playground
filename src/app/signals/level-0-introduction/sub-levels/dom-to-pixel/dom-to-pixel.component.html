<section class="dtp">
  <!-- Sin bajada: el pipeline apaga las etapas que el cambio no dispara, así que decirlo por
       escrito repite lo que se está viendo. -->
  <header class="dtp-head">
    <h2 class="dtp-title">No todo cambio cuesta lo mismo.</h2>
  </header>

  <div class="dtp-controls">
    @for (demo of demos; track demo.kind) {
      <button
        class="dtp-btn"
        [class.dtp-active]="selected().kind === demo.kind"
        (click)="pick(demo)"
      >
        {{ demo.label }}
      </button>
    }
  </div>

  <code class="dtp-code">{{ selected().code }}</code>

  <svg
    class="dtp-pipe"
    viewBox="0 0 1000 240"
    role="img"
    aria-label="Pipeline de render: el flujo salta las etapas que el cambio no dispara"
  >
    <!-- Zona cara: layout + paint, la que las animaciones baratas sobrevuelan. -->
    <rect class="dtp-zone" x="420" y="52" width="360" height="150" rx="16" />
    <text class="dtp-zone-label" x="600" y="40" text-anchor="middle">
      capas caras · layout + paint
    </text>

    <!-- Riel base tenue: todo el recorrido posible. -->
    <path class="dtp-rail" d="M60,150 L940,150" pathLength="100" />

    <!-- Flujo real + pulso que lo recorre: se redibujan y re-animan al cambiar el costo. -->
    @for (c of [cost()]; track c) {
      <path class="dtp-flow" [attr.d]="flowPath()" [attr.stroke]="costColor()" pathLength="100" />
      <circle
        class="dtp-pulse"
        cx="0"
        cy="0"
        r="8"
        [attr.fill]="costColor()"
        [style.offset-path]="pulsePath()"
      />
    }

    <!-- Estaciones. -->
    @for (s of stations; track s.id) {
      <g
        class="dtp-station"
        [class.dtp-source]="s.id === 'DOM'"
        [class.dtp-on]="stageOn(s.id)"
        [class.dtp-skip]="s.id !== 'DOM' && !stageOn(s.id)"
      >
        <circle [attr.cx]="s.x" cy="150" r="13" />
        <text class="dtp-station-label" [attr.x]="s.x" y="192" text-anchor="middle">
          {{ s.id }}
        </text>
      </g>
    }
  </svg>

  <!-- La palabra del costo sola: qué etapas se saltearon ya lo dicen las estaciones apagadas. -->
  <p class="dtp-cost">
    <span class="dtp-cost-word" [style.color]="costColor()">{{ cost() }}</span>
  </p>
</section>
