<section class="dtp">
  <!-- Sin bajada: el pipeline apaga las etapas que el cambio no dispara, así que decirlo por
       escrito repite lo que se está viendo. -->
  <header class="dtp-head">
    <h2 class="dtp-title">No todo cambio cuesta lo mismo.</h2>
  </header>

  <div class="dtp-controls">
    @for (demo of demos; track demo.kind) {
      <button
        class="dtp-btn"
        [class.dtp-active]="selected().kind === demo.kind"
        (click)="pick(demo)"
      >
        {{ demo.label }}
      </button>
    }
  </div>

  <code class="dtp-code">{{ selected().code }}</code>

  <svg
    class="dtp-pipe"
    viewBox="0 0 1000 240"
    role="img"
    aria-label="Pipeline de render: el flujo salta las etapas que el cambio no dispara"
  >
    <!-- Zona cara: layout + paint, la que las animaciones baratas sobrevuelan. El rótulo no
         repite sus nombres: las dos estaciones están adentro, justo debajo. -->
    <rect class="dtp-zone" x="420" y="52" width="360" height="150" rx="16" />
    <text class="dtp-zone-label" x="600" y="40" text-anchor="middle">capas caras</text>

    <!-- Riel base tenue: todo el recorrido posible. -->
    <path class="dtp-rail" d="M60,150 L940,150" pathLength="100" />

    <!-- Flujo real + pulso que lo recorre: se redibujan y re-animan al cambiar el costo. -->
    @for (c of [cost()]; track c) {
      <path class="dtp-flow" [attr.d]="flowPath()" [attr.stroke]="costColor()" pathLength="100" />
      <circle
        class="dtp-pulse"
        cx="0"
        cy="0"
        r="8"
        [attr.fill]="costColor()"
        [style.offset-path]="pulsePath()"
      />
    }

    <!-- Estaciones. -->
    @for (s of stations; track s.id) {
      <g
        class="dtp-station"
        [class.dtp-source]="s.id === 'DOM'"
        [class.dtp-on]="stageOn(s.id)"
        [class.dtp-skip]="s.id !== 'DOM' && !stageOn(s.id)"
      >
        <circle [attr.cx]="s.x" cy="150" r="13" />
        <text class="dtp-station-label" [attr.x]="s.x" y="192" text-anchor="middle">
          {{ s.id }}
        </text>
      </g>
    }
  </svg>

  <!-- Angosto: el mismo pipeline en vertical, con los rótulos en HTML. El SVG escala con el ancho
       (viewBox de 1000) y en un teléfono dejaba los rótulos en 4 px. -->
  <div
    class="dtp-vpipe"
    role="group"
    aria-label="Pipeline de render: el flujo salta las etapas que el cambio no dispara"
    [style.--flujo]="costColor()"
  >
    <span class="dtp-vzone" aria-hidden="true"><span>capas caras</span></span>
    <!-- Se rearma al cambiar el costo, como el flujo del SVG: así el recorrido se vuelve a dibujar. -->
    @for (c of [cost()]; track c) {
      @if (filasDelSalto(); as filas) {
        <span
          class="dtp-vhop"
          aria-hidden="true"
          [style.grid-row]="filas"
          [style.--d]="(retrasos().arco ?? 0) + 's'"
        ></span>
      }
      @for (s of stations; track s.id; let i = $index) {
        <span
          class="dtp-vst"
          aria-hidden="true"
          [style.grid-row]="i + 1"
          [style.--d]="(retrasos().tramos[i] ?? 0) + 's'"
          [class.dtp-source]="s.id === 'DOM'"
          [class.dtp-on]="stageOn(s.id)"
          [class.dtp-skip]="s.id !== 'DOM' && !stageOn(s.id)"
          [class.dtp-vst--directo]="tramoDirecto(i)"
          [class.dtp-vst--ultima]="i === stations.length - 1"
        >
          <span class="dtp-vdot"></span>
          <span class="dtp-vlabel">{{ s.id }}</span>
        </span>
      }
    }
    <!-- La respuesta va al lado de DOM/style y no abajo: en un teléfono bajo, abajo quedaba fuera
         de la vista. -->
    <p class="dtp-vcosto" [style.color]="costColor()">{{ cost() }}</p>
  </div>

  <!-- La palabra del costo sola: qué etapas se saltearon ya lo dicen las estaciones apagadas. -->
  <p class="dtp-cost">
    <span class="dtp-cost-word" [style.color]="costColor()">{{ cost() }}</span>
  </p>
</section>

<app-manipulable-system [system]="closingSystem" />
