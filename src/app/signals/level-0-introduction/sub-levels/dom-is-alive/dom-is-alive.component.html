<app-pagina-del-manual [guia]="guia()" [respiro]="2200" [paso]="paso()" [resuelta]="sano()">
  <p hacer>Corré.</p>
  <!-- Nombra el selector que dio null, tal como está en el código: el que hay que tocar. -->
  <p arreglo>
    Cambiá <code>'{{ fallido() }}'</code>.
  </p>

  <app-escena-vivo escena [nodos]="dom()" [corrida]="corrida()" [sano]="sano()" />

  <!-- Los nodos se ven una sola vez, en la pantalla de la nave. Acá va lo que se toca: las tres
       líneas, con el selector del título como hueco, y la corrida. -->
  <section consola class="dia">
    <div class="dia-codigo" role="group" aria-label="Las líneas que cambian los nodos">
      @for (r of fijas; track $index) {
        <span class="dia-linea" [innerHTML]="r"></span>
      }
      <button
        type="button"
        class="dia-hueco"
        [class.dia-hueco--encuentra]="encuentra()"
        [attr.aria-label]="'Cambiar el selector: ' + selector()"
        (click)="cambiarSelector()"
      >
        <!-- La mano señala el selector, no la punta del renglón: lo que se cambia es eso. -->
        <span class="dia-linea"
          ><span [innerHTML]="antesDelSelector"></span
          ><span class="dia-sel" data-guia="selector">'{{ selector() }}'</span
          ><span [innerHTML]="despuesDelSelector"></span>
          @if (dioNull()) {
            <span class="dia-null">// null</span>
          }
        </span>
      </button>
    </div>

    <div class="dia-mando">
      <button
        type="button"
        class="dia-correr"
        [attr.data-cuenta]="cuenta()"
        (click)="correrCodigo()"
      >
        &#9654; correr
      </button>
    </div>
  </section>
</app-pagina-del-manual>
