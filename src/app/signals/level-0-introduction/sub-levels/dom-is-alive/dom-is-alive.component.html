<app-pagina-del-manual [guia]="guia()" [respiro]="700">
  <p hacer class="dia-hacer">Corré una línea.</p>

  <!-- Las líneas son botones con el querySelector a la vista, y el nodo que tocan parpadea. Correr
       una y mirar es la explicación. -->
  <section demo class="dia">
    <div class="dia-console">
      @for (m of mutations; track m.id) {
        <button class="dia-run" [attr.data-guia]="m.id" (click)="run(m)">
          <span class="dia-run-icon" aria-hidden="true">▸</span>
          <code [innerHTML]="cortes(m.code)"></code>
        </button>
      }
    </div>

    <div class="dia-fila">
      <div class="dia-dom" role="group" aria-label="Nodos del DOM">
        @for (node of dom(); track node.id) {
          <div class="dia-node" [class.dia-touched]="isTouched(node.id)">
            <span class="dia-node-sel">{{ node.selector }}</span>
            <span class="dia-node-val">{{ node.text }}</span>
            @if (isTouched(node.id)) {
              @for (r of [runId()]; track r) {
                <span class="dia-ping" aria-hidden="true"></span>
              }
            }
          </div>
        }
      </div>
      <button class="dia-reset" (click)="reset()">Reiniciar el DOM</button>
    </div>
  </section>

  <app-escena-vivo
    escena
    [nodos]="dom()"
    [corrida]="runId()"
    [tocado]="lastTouched()"
    [sano]="sano()"
  />

  <app-manipulable-system
    desafio
    [system]="closingSystem"
    (corrida)="sano.set($event.salud === 'healthy')"
  />
</app-pagina-del-manual>
