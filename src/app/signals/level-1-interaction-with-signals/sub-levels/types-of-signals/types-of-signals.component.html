<app-column-and-code-layout
  title="Tipos de signal"
  [codeLines]="lines()"
  concept="No todos los signals son iguales: hay escribibles (WritableSignal) y de solo lectura (Signal y computed)."
  action="Tocá cada tipo para ver cómo se crea."
  observe="Solo el WritableSignal se puede escribir; los otros dos son de solo lectura."
>
  <div class="lab lab__demo">
    <!-- Más chico que en el resto: dos filas de nodos, y es la pantalla más alta del capítulo. -->
    <app-circuito
      #circuito
      style="--ci-lado: 4.6rem"
      [nodos]="nodos()"
      [enlaces]="enlaces"
      (tocado)="select($event)"
    />

    <div class="lab__acciones">
      <button type="button" (click)="probarSet()">Probar <code>.set()</code></button>
      <span
        class="inline-block text-xs font-bold px-2 py-0.5 rounded-full"
        [class]="
          selected().writable ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'
        "
      >
        {{ selected().writable ? 'escribible' : 'solo lectura' }}
      </span>
    </div>
    <p class="lab__nota">{{ selected().description }}</p>

    <!-- El resultado de la introspección es el dato que el sub-nivel enseña, así que se lee en tinta. -->
    <div class="lab__chips">
      <code class="lab__dato">
        isSignal() → <strong>{{ introspection().isSignal }}</strong>
      </code>
      <code class="lab__dato">
        isWritableSignal() → <strong>{{ introspection().isWritableSignal }}</strong>
      </code>
    </div>
  </div>
</app-column-and-code-layout>

<app-manipulable-system [system]="closingSystem" />
