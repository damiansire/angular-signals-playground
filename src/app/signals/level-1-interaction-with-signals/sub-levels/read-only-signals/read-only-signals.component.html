<app-column-and-code-layout
  title="Read-only signals: asReadonly()"
  [codeLines]="lines()"
  concept="asReadonly() expone un signal que se lee pero no se escribe desde afuera."
  action="Incrementá (interno) y reseteá."
  observe="count() refleja los cambios; quien lo recibe no puede llamar .set()."
>
  <div class="lab lab__demo">
    <app-circuito #circuito [nodos]="nodos()" [enlaces]="enlaces" />

    <div class="lab__acciones">
      <button
        type="button"
        class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-2 px-4 rounded"
        (click)="increment()"
      >
        Incrementar (interno)
      </button>
      <button type="button" class="boton-tinta" (click)="reset()">Reiniciar</button>
      <button type="button" (click)="escribirDesdeAfuera()"><code>count.set(5)</code></button>
    </div>

    <p class="lab__nota">
      Solo el dueño lo modifica, vía el signal privado. <code>count.set(…)</code> ni siquiera
      compila: <code>Signal&lt;T&gt;</code> no tiene <code>set</code>.
    </p>
  </div>
</app-column-and-code-layout>

<app-manipulable-system [system]="closingSystem" />
