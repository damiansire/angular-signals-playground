<app-column-and-code-layout
  title="Writable Signal"
  [codeLines]="lines()"
  concept="signal.set() reemplaza el valor de un writable signal por uno nuevo."
  action="Escribí un número y tocá Set."
  observe="El contador toma exactamente el valor que escribiste."
>
  <div class="lab lab__demo">
    <app-circuito #circuito [nodos]="nodos()" [enlaces]="enlaces" />
    <div class="lab__acciones">
      <label class="sr-only" for="signalSetInput">Número a escribir en el signal</label>
      <div class="lab__campo">
        <input
          #signalSetInput
          id="signalSetInput"
          type="number"
          placeholder="Escribí un número"
          [attr.aria-invalid]="rejected() ? 'true' : null"
          (input)="clearRejected()"
          (keyup.enter)="setValue()"
        />
      </div>
      <button type="button" (click)="setValue()">Set</button>
      <span class="lab__lectura">Valor: {{ count() }}</span>
    </div>
    @if (rejected()) {
      <p class="lab__error" role="alert">Escribí un número: el signal quedó como estaba.</p>
    }
  </div>
</app-column-and-code-layout>

<app-manipulable-system [system]="closingSystem" />
