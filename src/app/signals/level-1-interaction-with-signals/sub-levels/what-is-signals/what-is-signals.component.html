<app-concept-card
  concept="Un signal es un envoltorio alrededor de un valor que avisa a sus consumidores cuando ese valor cambia."
  action="Clickeá las cajitas para convertirlas en contenedores."
  observe="Cualquier tipo de valor puede ir adentro de un signal."
/>

<!-- Demo agrupado en UN contenedor: en la vista integrada la card reparte el contenido en un grid, y
     suelto se apilaba a lo alto y la descripción caía debajo del título vertical del nivel. -->
<div class="lab">
  <app-title [title]="title"></app-title>
  <div class="lab__fila">
    <div class="lab__demo">
      <!-- Más chico que en el resto: dos filas de nodos, y envueltos el desafío ya no entraba. -->
      <app-circuito
        style="--ci-lado: 4.6rem"
        [nodos]="nodos()"
        [enlaces]="enlaces()"
        (tocado)="alTocar($event)"
      />
      @if (clickCount() > 0) {
        <app-text-description
          text="Un signal puede contener cualquier valor, desde primitivos hasta estructuras complejas."
        >
        </app-text-description>
      }
    </div>
    @if (clickCount() > 0) {
      <div class="lab__codigos">
        <app-code [lines]="signalWrapperLines()"></app-code>
        <!-- Aclaración importante (que esto NO es API real), así que tiene que leerse. -->
        <p class="lab__nota">
          SignalWrapper&lt;T&gt; es una metáfora para entender la idea; no es API real de Angular.
        </p>
      </div>
    }
  </div>
</div>

<app-manipulable-system [system]="closingSystem" />
