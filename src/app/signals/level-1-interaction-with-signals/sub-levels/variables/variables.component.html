<app-concept-card
  concept="Repaso pre-signals: en JS guardás un valor en una variable (var / const / let)."
  action="Elegí un tipo y después un valor de ejemplo."
  observe="El valor elegido aparece en las tres declaraciones (var/const/let difieren en alcance y reasignación)."
/>

<!-- Demo agrupado en UN contenedor: en la vista integrada la card reparte el contenido en un grid, y
     sin este wrapper los bloques caían en filas separadas y se pasaban del fold en laptop. -->
<div class="lab">
  <app-title title="Variables (repaso pre-signals)"></app-title>
  <div class="lab__fila">
    <div class="lab__demo">
      <div class="lab__chips" role="group" aria-label="Tipo de dato">
        @for (type of dataTypes; track type) {
          <button
            type="button"
            class="lab__chip"
            [attr.aria-pressed]="type === selectedType().name"
            (click)="selectType({ name: type, value: '' })"
          >
            {{ type }}
          </button>
        }
      </div>
      <div class="lab__chips" role="group" aria-label="Valor de ejemplo">
        @for (item of selectedType().examples; track $index) {
          <button
            type="button"
            class="lab__chip"
            [attr.aria-pressed]="item === selectedExampleValue()"
            (click)="selectExample({ name: item, value: '' })"
          >
            {{ item }}
          </button>
        }
      </div>
      <app-circuito [nodos]="cajas()" />
    </div>
    <app-code [lines]="lines()"></app-code>
  </div>
</div>

<app-manipulable-system [system]="closingSystem" />
