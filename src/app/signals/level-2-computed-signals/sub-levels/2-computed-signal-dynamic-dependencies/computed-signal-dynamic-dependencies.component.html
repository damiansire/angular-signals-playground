<app-concept-card
  concept="Un computed depende solo de lo que LEE en cada ejecución: las dependencias son dinámicas."
  action="Cambiá ShowCount e incrementá Count."
  observe="Con ShowCount en false, subir Count NO recomputa conditionalCount."
/>
<div class="lab">
  <div class="lab__fila">
    <div class="lab__demo">
      <!-- Más chico que en el resto: acá el código tiene nueve renglones y el desafío tiene que entrar. -->
      <app-circuito
        style="--ci-lado: 4.6rem"
        [nodos]="nodos()"
        [enlaces]="enlaces()"
        (tocado)="alTocar($event)"
      />
      <app-dependencies-status
        [dependencies]="dependencies()"
        [signalsInside]="signalsInside()"
        computedName="conditionalCount"
      ></app-dependencies-status>
      <div class="lab__fila">
        <app-event-history
          title="conditionalCount Recomputations"
          [history]="conditionalCountHistory()"
        ></app-event-history>
        <app-event-history
          title="All Signals Recomputations"
          [history]="appEventHistory()"
        ></app-event-history>
      </div>
    </div>
    <app-code [lines]="lines()"></app-code>
  </div>
</div>

<app-manipulable-system [system]="closingSystem" />
