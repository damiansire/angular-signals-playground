<app-column-and-code-layout
  title="Computed signals"
  [codeLines]="lines()"
  concept="computed() deriva un valor de otros signals y se recalcula solo cuando cambian."
  action="Escribí en Name y Surname."
  observe="El saludo se actualiza solo; nunca escribís fullName a mano."
>
  <div class="lab lab__demo">
    <div class="lab__acciones">
      <div class="lab__campo">
        <label class="lab__rotulo" for="firstName">Name:</label>
        <input
          id="firstName"
          type="text"
          [value]="firstName()"
          (input)="setFirstName($event.target)"
          placeholder="Name"
        />
      </div>
      <div class="lab__campo">
        <label class="lab__rotulo" for="surname">Surname:</label>
        <input
          id="surname"
          type="text"
          [value]="surname()"
          (input)="setLastName($event.target)"
          placeholder="Surname"
        />
      </div>
    </div>
    <app-circuito #circuito [nodos]="nodos()" [enlaces]="enlaces" (tocado)="escribirDerivado()" />
    <p class="lab__lectura">Hola, {{ fullName() }}!</p>
  </div>
</app-column-and-code-layout>

<app-manipulable-system [system]="closingSystem" />
