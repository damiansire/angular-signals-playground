<div class="contador">
  <span class="contador__rotulo">{{ label() }}</span>
  <span class="contador__valor">{{ count() }}</span>
  <button
    type="button"
    class="bg-amber-500 hover:bg-amber-600 text-gray-900 font-bold py-1.5 px-4 rounded"
    (click)="increment()"
  >
    + {{ step() }}
  </button>
</div>
