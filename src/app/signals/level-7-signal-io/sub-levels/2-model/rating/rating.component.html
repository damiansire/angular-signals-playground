<div class="rating flex gap-1" role="group" aria-label="Puntuación">
  @for (star of stars; track star) {
    <button
      type="button"
      class="rating__star text-3xl leading-none transition-transform motion-safe:hover:scale-110"
      [class.rating__star--on]="star <= value()"
      [attr.aria-label]="star + ' estrellas'"
      [attr.aria-pressed]="star === value()"
      (click)="setValue(star)"
    >
      {{ star <= value() ? '★' : '☆' }}
    </button>
  }
</div>
