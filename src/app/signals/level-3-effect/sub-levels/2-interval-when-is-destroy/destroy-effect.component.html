<app-concept-card
  concept="Un effect() se destruye con el componente, pero un setInterval que arrancó adentro NO se limpia solo."
  action="Prendé el intervalo y después destruí al hijo."
  observe="El reloj desaparece, pero los latidos SIGUEN subiendo: el intervalo quedó vivo (leak, a propósito)."
/>

<div class="flex">
  <div>
    <button (click)="destroy()">Destruir hijo</button>
    @if (showComponent()) {
      <div>
        <app-destroy-box [relojes]="relojes" (autoRefreshEvent)="setAutoRefresh($event)" />
      </div>
    }
    <p class="my-3 text-sm">
      Latidos:
      <b class="font-mono text-base">{{ relojes.latidos() }}</b>
      <span class="text-gray-500"> (sigue subiendo tras destruirlo: leak a propósito)</span>
    </p>
    <app-event-history
      title="Últimos latidos"
      [history]="relojes.historial()"
      stateName="Latido:"
    ></app-event-history>
  </div>

  <div class="flex-grow">
    <app-code [lines]="lines()" textSize="text-lg"></app-code>
  </div>
</div>

<app-manipulable-system [system]="closingSystem" />
