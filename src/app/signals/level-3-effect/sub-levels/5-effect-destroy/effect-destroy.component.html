<app-concept-card
  concept="Con onCleanup, la limpieza corre al apagar el intervalo y también al destruirse el hijo."
  action="Prendé el intervalo y después destruí al hijo."
  observe="Los latidos se frenan: onCleanup apagó el intervalo del hijo."
/>

<div class="flex">
  <div>
    <button (click)="destroy()">Destruir hijo</button>
    @if (showComponent()) {
      <div>
        <app-component-destroy [relojes]="relojes" (autoRefreshEvent)="setAutoRefresh($event)" />
      </div>
    }
    <p class="my-3 text-sm">
      Latidos:
      <b class="font-mono text-base">{{ relojes.latidos() }}</b>
      <span class="text-gray-500"> (se frena al destruirlo: onCleanup)</span>
    </p>
    <app-event-history
      title="Últimos latidos"
      [history]="relojes.historial()"
      stateName="Latido:"
    ></app-event-history>
  </div>

  <div class="flex-grow">
    <app-code [lines]="lines()" textSize="text-lg"></app-code>
  </div>
</div>

<app-manipulable-system [system]="closingSystem" />
