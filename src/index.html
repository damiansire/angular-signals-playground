<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Angular Signals: introducción interactiva</title>
    <meta
      name="description"
      content="Playground interactivo para aprender Angular Signals desde cero: computed, effect, linkedSignal, resource y change detection, cada concepto en una pantalla donde hacés click y ves la reactividad en vivo."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- sizes en el .ico hace que los navegadores con soporte prefieran el SVG nítido. -->
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <!-- Tarjetas sociales: la app se comparte por link para talks/workshops. La imagen es la colina
         con el título del juego (docs/tarjeta-social): la vista integrada achicada no se leía. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Angular Signals: introducción interactiva" />
    <meta property="og:locale" content="es_LA" />
    <meta
      property="og:title"
      content="Las aventuras de Angie por el SignalVerso · Angular Signals"
    />
    <meta
      property="og:description"
      content="Una introducción interactiva a los Signals de Angular: Angie te espera en la colina y te enseña las reglas de su mundo. signal, computed, effect, linkedSignal y resource, cada uno en una pantalla que tocás y responde. Gratis, en el navegador."
    />
    <meta property="og:url" content="https://damiansire.github.io/angular-signals-playground/" />
    <meta
      property="og:image"
      content="https://damiansire.github.io/angular-signals-playground/tarjeta-social.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Las aventuras de Angie por el SignalVerso: Angie, una gema rosa, feliz y con una capa violeta al viento, levanta su lamparita encendida sentada en una piedra en la cima de una colina verde, con el sol al costado."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Las aventuras de Angie por el SignalVerso · Angular Signals"
    />
    <meta
      name="twitter:description"
      content="Una introducción interactiva a los Signals de Angular: Angie te espera en la colina y te enseña las reglas de su mundo, una pantalla que tocás por concepto."
    />
    <meta
      name="twitter:image"
      content="https://damiansire.github.io/angular-signals-playground/tarjeta-social.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="Las aventuras de Angie por el SignalVerso: Angie, una gema rosa, feliz y con una capa violeta al viento, levanta su lamparita encendida sentada en una piedra en la cima de una colina verde, con el sol al costado."
    />
    <!-- Sustrato tipográfico compartido: Archivo (display) + Baloo 2 (título de la colina) + JetBrains Mono (valores/código) + Fraunces (editorial) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Baloo+2:wght@600;800&family=JetBrains+Mono:wght@400;500;600&family=Fraunces:opsz,wght@9..144,400;9..144,600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
    <!-- Sin JS la app renderiza una pantalla en blanco sin ninguna explicación. Es un playground
         interactivo: no hay una versión estática que sirva de reemplazo, pero decir por qué está
         vacío cuesta cuatro líneas y evita que parezca un sitio roto. -->
    <noscript>
      <div style="margin: 4rem auto; max-width: 34rem; padding: 0 1.5rem; font-family: sans-serif">
        <h1 style="font-size: 1.25rem">Este recorrido necesita JavaScript</h1>
        <p>
          Es un playground interactivo sobre reactividad: cada pantalla es una demo que responde a
          lo que tocás, así que no hay una versión estática equivalente. Activá JavaScript para
          verlo.
        </p>
      </div>
    </noscript>
  </body>
</html>
